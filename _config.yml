# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole site, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing these this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.github_repo }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: CS 171
tagline: Introduction to Cryptography
description: Introduction to Cryptography course website
# author: Kevin Lin
baseurl: '/cs171-fall26' # the subpath of your site, e.g. /blog
url: 'https://crypto-berkeley.github.io' # the base hostname & protocol for your site, e.g. http://example.com
exclude: ["Gemfile", "Gemfile.lock", "LICENSE", "vendor"]
favicon_ico: "/assets/images/alice.ico"

# Theme settings
remote_theme: just-the-docs/just-the-docs@v0.5.1
color_scheme: light
search_enabled: true
heading_anchors: true
permalink: pretty
aux_links:
  Ed:
    - 'https://edstem.org/us/courses/102589/discussion'
  Gradescope:
    - 'https://www.gradescope.com/courses/1362375'
  Course Calendar:
    - 'https://calendar.google.com/calendar/embed?src=c_d87d0b181225891bb584c425f5ff2fc18b964133e6f189169a307d72dec7d84d%40group.calendar.google.comhttps://calendar.google.com/calendar/embed?src=c_88c724eaf1974649af13fe96f12939d2e5f8007e3138367e50ba566c93cf63fc%40group.calendar.google.com&ctz=America%2FLos_Angelesctz=America%2FLos_Angeles'
  Email:
    - 'mailto:cs171@berkeley.edu'

footer_content:

# Collections for website data
collections:
  staffers:
  modules:
  schedules:
  announcements:
# Default layouts for each collection type
defaults:
  - scope:
      path: ''
      type: staffers
    values:
      layout: staffer
      height: 300
      subpath: '/cs171-fall26/assets/images/'
      width: 300
  - scope:
      path: ''
      type: modules
    values:
      layout: module
  - scope:
      path: ''
      type: schedules
    values:
      layout: schedule
  - scope:
      path: ''
      type: announcements
    values:
      layout: announcement

compress_html:
  clippings: all
  comments: all
  endings: all
  startings: []
  blanklines: false
  profile: false
